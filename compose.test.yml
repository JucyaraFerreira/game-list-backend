services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gamelist_auth_test
      POSTGRES_USER: auth_test
      POSTGRES_PASSWORD: ${AUTH_TEST_POSTGRES_PASSWORD:?Defina uma senha temporária para o banco de teste}
    ports:
      - "127.0.0.1:0:5432"
    tmpfs:
      - /var/lib/postgresql/data:rw,size=256m
    labels:
      codex.purpose: gamelist-auth-task-9
      codex.run: ${AUTH_TEST_RUN_ID:?Defina um identificador único para esta execução}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_test -d gamelist_auth_test"]
      interval: 1s
      timeout: 3s
      retries: 40
